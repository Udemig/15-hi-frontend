<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Modern hava durumu uygulaması — şehir, sıcaklık, nem ve rüzgar bilgileri"
    />
    <title>Hava Durumu</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app" data-theme="default">
      <header class="app-header">
        <h1 class="app-title">Hava Durumu</h1>
        <p class="app-subtitle">Güncel hava bilgileri</p>
      </header>

      <main class="app-main">
        <section class="search-panel" aria-label="Şehir seçimi">
          <label class="search-label" for="city-select">Şehir</label>
          <div class="search-row">
            <select id="city-select" class="city-select" name="city">
              <!-- Options populated by JavaScript -->
            </select>
            <button type="button" id="refresh-btn" class="btn-refresh" aria-label="Verileri yenile">
              <svg class="icon-refresh" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.99 5.99 0 0 1-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
                />
              </svg>
            </button>
          </div>
        </section>

        <article class="weather-card" id="weather-card" aria-live="polite">
          <div class="weather-card__loading" id="weather-loading" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span>Yükleniyor…</span>
          </div>

          <div class="weather-card__content" id="weather-content">
            <header class="weather-header">
              <h2 class="city-name" id="city-name">—</h2>
              <p class="condition-text" id="condition-text">—</p>
            </header>

            <div class="weather-hero">
              <div class="weather-icon" id="weather-icon" aria-hidden="true"></div>
              <p class="temperature">
                <span class="temperature__value" id="temperature">—</span>
                <span class="temperature__unit">°C</span>
              </p>
            </div>

            <dl class="weather-stats">
              <div class="stat">
                <dt class="stat__label">Hissedilen</dt>
                <dd class="stat__value" id="feels-like">—</dd>
              </div>
              <div class="stat">
                <dt class="stat__label">Nem</dt>
                <dd class="stat__value" id="humidity">—</dd>
              </div>
              <div class="stat">
                <dt class="stat__label">Rüzgar</dt>
                <dd class="stat__value" id="wind-speed">—</dd>
              </div>
            </dl>
          </div>
        </article>

        <p class="data-notice" role="note">
          Bu uygulama örnek veriler kullanır; gerçek zamanlı API bağlantısı yoktur.
        </p>
      </main>

      <footer class="app-footer">
        <p>&copy; <span id="year"></span> Hava Durumu</p>
      </footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
