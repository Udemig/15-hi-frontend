<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Hava Durumu</title>
    <meta name="description" content="Modern, şık ve güncel hava durumu uygulaması.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="weather-card glassmorphism">
            <header class="search-section">
                <input type="text" id="city-input" placeholder="Şehir ara (Örn: İstanbul)..." autocomplete="off">
                <button id="search-btn" aria-label="Ara" title="Ara">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </header>

            <main class="weather-main" id="weather-main">
                <div class="weather-icon-container">
                    <!-- Default sun icon as placeholder, will be replaced by JS -->
                    <svg id="weather-icon-svg" viewBox="0 0 24 24" width="100" height="100" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="weather-svg drop-shadow">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </div>
                <div class="temperature fade-in">
                    <span id="temp-value">24</span><span class="degree">°C</span>
                </div>
                <div class="condition fade-in" id="condition">Güneşli</div>
                <h1 class="city fade-in" id="city-name">İstanbul</h1>
            </main>

            <footer class="weather-details" id="weather-details">
                <div class="detail-item fade-in-up" style="--delay: 0.1s">
                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                    </div>
                    <div class="detail-info">
                        <span class="detail-label">Hissedilen</span>
                        <span class="detail-value" id="feels-like">26°C</span>
                    </div>
                </div>
                <div class="detail-item fade-in-up" style="--delay: 0.2s">
                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                        </svg>
                    </div>
                    <div class="detail-info">
                        <span class="detail-label">Nem</span>
                        <span class="detail-value" id="humidity">%45</span>
                    </div>
                </div>
                <div class="detail-item fade-in-up" style="--delay: 0.3s">
                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
                        </svg>
                    </div>
                    <div class="detail-info">
                        <span class="detail-label">Rüzgar</span>
                        <span class="detail-value" id="wind-speed">12 km/s</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
